services:
  mongodb:
    image: mongo:7.0
    container_name: precision-reviewer-mongodb
    restart: unless-stopped
    ports:
      # Bound to localhost only: MongoDB runs without auth, so it must never be reachable from outside the host
      - "127.0.0.1:27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=pr_reviewer_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - pr-reviewer-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chromadb:
    # Pinned to match the chromadb Python client in services/ai-service/requirements.txt
    image: chromadb/chroma:1.5.9
    container_name: precision-reviewer-chromadb
    restart: unless-stopped
    ports:
      # Host port 8001 maps to internal 8000 to prevent port collision with FastAPI
      - "127.0.0.1:8001:8000"
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      # Chroma 1.x persists to /data (see /config.yaml in the image)
      - chromadb_data:/data
    networks:
      - pr-reviewer-network
    healthcheck:
      # The Chroma image ships without curl, so probe the v2 heartbeat over bash /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: precision-reviewer-ai-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CHROMA_COLLECTION=codebase_knowledge
      - LOG_LEVEL=info
      - MOCK_LLM_MODE=${MOCK_LLM_MODE:-true}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-120b}
    depends_on:
      chromadb:
        condition: service_healthy
    networks:
      - pr-reviewer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  integration-service:
    build:
      context: ./services/integration-service
      dockerfile: Dockerfile
    container_name: precision-reviewer-integration-service
    restart: unless-stopped
    ports:
      # Bound to localhost only: public traffic reaches the webhook through the reverse proxy (Caddy)
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/pr_reviewer_db
      - AI_SERVICE_URL=http://ai-service:8000
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:?Set GITHUB_WEBHOOK_SECRET in .env}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-mock_dev_token}
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - pr-reviewer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_data:
    driver: local
  chromadb_data:
    driver: local

networks:
  pr-reviewer-network:
    driver: bridge
